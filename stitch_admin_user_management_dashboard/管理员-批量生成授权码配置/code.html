<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>管理员 - 批量生成授权码配置</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4913ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#151022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop (Simulated) -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>
<!-- Main Modal Container -->
<div class="relative w-full max-w-[640px] bg-background-light dark:bg-[#1c162d] rounded-xl shadow-2xl border border-gray-200 dark:border-[#3f3267] overflow-hidden flex flex-col">
<!-- Header Component (PageHeading variation) -->
<div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-[#3f3267]">
<div class="flex flex-col gap-1">
<h2 class="text-gray-900 dark:text-white text-2xl font-bold leading-tight">批量生成授权码配置</h2>
<p class="text-gray-500 dark:text-[#a092c9] text-sm font-normal">为中小学智能提升训练平台配置并导出授权码</p>
</div>
<button class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Scrollable Content Area -->
<div class="p-6 space-y-6 overflow-y-auto max-h-[70vh]">
<!-- Configuration Section -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- TextField: Generation Quantity -->
<div class="flex flex-col gap-2">
<label class="flex flex-col w-full">
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal pb-2 flex items-center gap-1">
                            生成数量 <span class="text-red-500">*</span>
</p>
<div class="relative">
<input class="form-input flex w-full rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-[#3f3267] bg-white dark:bg-[#201933] h-12 placeholder:text-gray-400 dark:placeholder:text-[#a092c9] px-4 text-base font-normal" placeholder="请输入数量 (1-1000)" type="number" value="100"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">个</span>
</div>
</label>
</div>
<!-- TextField: Batch ID -->
<div class="flex flex-col gap-2">
<label class="flex flex-col w-full">
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal pb-2">备注/批次号</p>
<input class="form-input flex w-full rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-[#3f3267] bg-white dark:bg-[#201933] h-12 placeholder:text-gray-400 dark:placeholder:text-[#a092c9] px-4 text-base font-normal" placeholder="如：2024夏季推广" type="text" value=""/>
</label>
</div>
</div>
<!-- RadioList: Validity Period -->
<div class="flex flex-col gap-2">
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal pb-1 flex items-center gap-1">
                    有效期 <span class="material-symbols-outlined text-[16px] text-gray-400" title="授权码自激活之日起计算有效期">info</span>
</p>
<div class="flex flex-wrap gap-3">
<label class="group flex-1 min-w-[100px] text-sm font-medium leading-normal flex items-center justify-center rounded-lg border border-gray-300 dark:border-[#3f3267] px-4 h-11 text-gray-700 dark:text-white cursor-pointer hover:bg-gray-50 dark:hover:bg-[#2a2145] transition-all has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:text-primary dark:has-[:checked]:border-primary dark:has-[:checked]:bg-primary/20">
                        1个月
                        <input class="hidden" name="validity" type="radio"/>
</label>
<label class="group flex-1 min-w-[100px] text-sm font-medium leading-normal flex items-center justify-center rounded-lg border border-gray-300 dark:border-[#3f3267] px-4 h-11 text-gray-700 dark:text-white cursor-pointer hover:bg-gray-50 dark:hover:bg-[#2a2145] transition-all has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:text-primary dark:has-[:checked]:border-primary dark:has-[:checked]:bg-primary/20">
                        1年
                        <input checked="" class="hidden" name="validity" type="radio"/>
</label>
<label class="group flex-1 min-w-[100px] text-sm font-medium leading-normal flex items-center justify-center rounded-lg border border-gray-300 dark:border-[#3f3267] px-4 h-11 text-gray-700 dark:text-white cursor-pointer hover:bg-gray-50 dark:hover:bg-[#2a2145] transition-all has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:text-primary dark:has-[:checked]:border-primary dark:has-[:checked]:bg-primary/20">
                        永久
                        <input class="hidden" name="validity" type="radio"/>
</label>
</div>
</div>
<!-- Preview Section (Custom Component) -->
<div class="space-y-3">
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex items-center gap-2">
<span class="material-symbols-outlined text-primary">visibility</span>
                    预览生成样式
                </h3>
<div class="bg-gray-50 dark:bg-[#110d1f] border border-dashed border-gray-300 dark:border-[#3f3267] rounded-xl p-4">
<div class="grid grid-cols-2 gap-3 opacity-60">
<div class="flex items-center justify-between p-3 bg-white dark:bg-[#201933] rounded border border-gray-200 dark:border-[#3f3267] font-mono text-sm dark:text-[#a092c9]">
<span>ABCD-1234-EFGH</span>
<span class="material-symbols-outlined text-xs">content_copy</span>
</div>
<div class="flex items-center justify-between p-3 bg-white dark:bg-[#201933] rounded border border-gray-200 dark:border-[#3f3267] font-mono text-sm dark:text-[#a092c9]">
<span>XYZA-9876-IJKL</span>
<span class="material-symbols-outlined text-xs">content_copy</span>
</div>
<div class="flex items-center justify-between p-3 bg-white dark:bg-[#201933] rounded border border-gray-200 dark:border-[#3f3267] font-mono text-sm dark:text-[#a092c9]">
<span>PLMK-4567-QWER</span>
<span class="material-symbols-outlined text-xs">content_copy</span>
</div>
<div class="flex items-center justify-between p-3 bg-white dark:bg-[#201933] rounded border border-gray-200 dark:border-[#3f3267] font-mono text-sm dark:text-[#a092c9]">
<span>UIOP-2233-VBNM</span>
<span class="material-symbols-outlined text-xs">content_copy</span>
</div>
</div>
<p class="text-center text-xs text-gray-400 mt-4 italic">系统将根据上述配置生成随机且唯一的授权码</p>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-6 border-t border-gray-200 dark:border-[#3f3267] flex items-center justify-end gap-4 bg-gray-50/50 dark:bg-black/20">
<button class="px-6 h-12 rounded-lg text-gray-700 dark:text-white font-medium hover:bg-gray-100 dark:hover:bg-white/5 transition-colors">
                取消
            </button>
<button class="px-8 h-12 rounded-lg bg-primary text-white font-bold hover:bg-opacity-90 shadow-lg shadow-primary/20 transition-all flex items-center gap-2">
<span class="material-symbols-outlined">bolt</span>
                确认生成
            </button>
</div>
<!-- Decorative background elements -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
</div>
</body></html>
