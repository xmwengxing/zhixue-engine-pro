# 自动标签配置

backend:
  - backend/**/*

frontend:
  - frontend/**/*

database:
  - backend/prisma/**/*
  - '**/migrations/**/*'

docker:
  - '**/Dockerfile'
  - '**/docker-compose*.yml'
  - '.dockerignore'

ci/cd:
  - '.github/workflows/**/*'

documentation:
  - '**/*.md'
  - 'docs/**/*'

dependencies:
  - '**/package.json'
  - '**/package-lock.json'

configuration:
  - '**/.env.example'
  - '**/tsconfig.json'
  - '**/.eslintrc*'
  - '**/.prettierrc*'

tests:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  - '**/tests/**/*'

api:
  - 'backend/src/routes/**/*'
  - 'backend/src/controllers/**/*'

ui:
  - 'frontend/src/components/**/*'
  - 'frontend/src/pages/**/*'

security:
  - 'backend/src/middlewares/auth.ts'
  - '**/security/**/*'
