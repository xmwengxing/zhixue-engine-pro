name: 自动代码审查

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # 代码审查
  review:
    name: 代码审查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # 检查提交信息格式
      - name: 检查提交信息
        uses: wagoid/commitlint-github-action@v5
        continue-on-error: true
      
      # 检查代码复杂度
      - name: 代码复杂度分析
        run: |
          echo "## 代码复杂度分析" >> $GITHUB_STEP_SUMMARY
          echo "检查高复杂度函数..." >> $GITHUB_STEP_SUMMARY
      
      # 检查文件大小
      - name: 检查大文件
        run: |
          echo "## 大文件检查" >> $GITHUB_STEP_SUMMARY
          find . -type f -size +500k -not -path "*/node_modules/*" -not -path "*/.git/*" | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "⚠️ 发现大文件: $file ($size)" >> $GITHUB_STEP_SUMMARY
          done
      
      # 检查 TODO 和 FIXME
      - name: 检查待办事项
        run: |
          echo "## 待办事项" >> $GITHUB_STEP_SUMMARY
          grep -r "TODO\|FIXME" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" . || echo "无待办事项" >> $GITHUB_STEP_SUMMARY
      
      # 检查控制台日志
      - name: 检查调试代码
        run: |
          echo "## 调试代码检查" >> $GITHUB_STEP_SUMMARY
          grep -r "console.log\|debugger" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" backend/src frontend/src || echo "未发现调试代码" >> $GITHUB_STEP_SUMMARY
      
      # PR 大小检查
      - name: PR 大小检查
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;
            
            let message = `## PR 大小分析\n\n`;
            message += `- 新增行数: ${additions}\n`;
            message += `- 删除行数: ${deletions}\n`;
            message += `- 总变更: ${total}\n\n`;
            
            if (total > 1000) {
              message += `⚠️ **警告**: PR 变更较大 (${total} 行)，建议拆分成多个小 PR。\n`;
            } else if (total > 500) {
              message += `ℹ️ **提示**: PR 变更适中 (${total} 行)。\n`;
            } else {
              message += `✅ **良好**: PR 大小合适 (${total} 行)。\n`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });
  
  # 自动标签
  auto-label:
    name: 自动添加标签
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 根据文件变更添加标签
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
  
  # 检查 PR 描述
  check-description:
    name: 检查 PR 描述
    runs-on: ubuntu-latest
    
    steps:
      - name: 检查 PR 描述完整性
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            
            const hasDescription = body.length > 50;
            const hasChecklist = body.includes('- [');
            const hasRelatedIssue = body.includes('#') || body.includes('issue');
            
            let message = '## PR 描述检查\n\n';
            message += `- ${hasDescription ? '✅' : '❌'} 描述详细 (至少 50 字符)\n`;
            message += `- ${hasChecklist ? '✅' : '❌'} 包含检查清单\n`;
            message += `- ${hasRelatedIssue ? '✅' : '❌'} 关联相关 Issue\n\n`;
            
            if (!hasDescription || !hasChecklist) {
              message += '⚠️ **建议**: 请完善 PR 描述，包括变更说明和测试清单。\n';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });
