name: CI - 持续集成

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '18'

jobs:
  # 后端代码检查和测试
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: 安装依赖
        working-directory: backend
        run: npm ci
      
      - name: 代码格式检查
        working-directory: backend
        run: npm run lint
      
      - name: 类型检查
        working-directory: backend
        run: npm run type-check
      
      - name: 运行数据库迁移
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_platform_test
        run: npx prisma migrate deploy
      
      - name: 运行单元测试
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_platform_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-at-least-32-chars
          JWT_EXPIRES_IN: 7d
          JWT_REFRESH_EXPIRES_IN: 30d
        run: npm run test:unit
      
      - name: 运行集成测试
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_platform_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-at-least-32-chars
          JWT_EXPIRES_IN: 7d
          JWT_REFRESH_EXPIRES_IN: 30d
        run: npm run test:integration
      
      - name: 生成测试覆盖率报告
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_platform_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-at-least-32-chars
          JWT_EXPIRES_IN: 7d
          JWT_REFRESH_EXPIRES_IN: 30d
        run: npm run test:coverage
      
      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
  
  # 前端代码检查和测试
  frontend-test:
    name: 前端测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      
      - name: 代码格式检查
        working-directory: frontend
        run: npm run lint
      
      - name: 类型检查
        working-directory: frontend
        run: npm run type-check
      
      - name: 运行单元测试
        working-directory: frontend
        run: npm run test:unit
      
      - name: 生成测试覆盖率报告
        working-directory: frontend
        run: npm run test:coverage
      
      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
      
      - name: 构建检查
        working-directory: frontend
        run: npm run build
  
  # 代码质量检查
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于 SonarCloud
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 安装后端依赖
        working-directory: backend
        run: npm ci
      
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      
      # 可选：集成 SonarCloud 代码质量分析
      # - name: SonarCloud 扫描
      #   uses: SonarSource/sonarcloud-github-action@master
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
  # Docker 镜像构建测试
  docker-build:
    name: Docker 镜像构建测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 构建后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: training-platform-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 构建前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: training-platform-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  # 安全扫描
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 运行 Trivy 漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: 上传 Trivy 扫描结果
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: 后端依赖安全审计
        working-directory: backend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: 前端依赖安全审计
        working-directory: frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true
