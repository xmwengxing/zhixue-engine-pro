name: 数据体检 - 脏数据检测

# 遗留建议④：把 clean-dirty-data.mjs 纳入定时任务，防止脏数据累积。
# 只检测不修改：检出脏数据时 job 失败并告警，由人工确认后再跑 `npm run db:clean-dirty`。
on:
  schedule:
    # 每周一 01:00 UTC（北京时间 09:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: '检测目标：ci（临时库，只验证脚本可跑）/ prod（用 Secrets 里的生产只读连接）'
        required: true
        default: 'ci'
        type: choice
        options:
          - ci
          - prod

env:
  NODE_VERSION: '18'

jobs:
  dirty-data-check:
    name: 脏数据检测
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        working-directory: backend
        run: npm ci

      - name: 生成 Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_platform_test
        run: npx prisma generate

      - name: 准备临时库结构
        if: ${{ github.event.inputs.target != 'prod' }}
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_platform_test
        run: npx prisma migrate deploy

      # 定时触发默认跑生产只读连接；未配置 Secret 时自动退回临时库，避免 workflow 长期红灯
      - name: 执行脏数据检测
        working-directory: backend
        env:
          PROD_URL: ${{ secrets.DATA_HYGIENE_DATABASE_URL }}
          TARGET: ${{ github.event.inputs.target || 'prod' }}
        run: |
          if [ "$TARGET" = "prod" ] && [ -n "$PROD_URL" ]; then
            echo "::notice::对生产库执行只读脏数据检测"
            DATABASE_URL="$PROD_URL" node scripts/clean-dirty-data.mjs --ci
          else
            if [ "$TARGET" = "prod" ]; then
              echo "::warning::未配置 DATA_HYGIENE_DATABASE_URL，退回临时库仅验证脚本可执行"
            fi
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/training_platform_test" \
              node scripts/clean-dirty-data.mjs --ci
          fi
