name: 依赖更新检查

on:
  schedule:
    # 每周一早上 8 点运行
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  # 检查依赖更新
  check-updates:
    name: 检查依赖更新
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 检查后端依赖更新
        working-directory: backend
        run: |
          npm outdated || true
          echo "## 后端依赖更新" >> $GITHUB_STEP_SUMMARY
          npm outdated --json > outdated.json || true
          cat outdated.json >> $GITHUB_STEP_SUMMARY
      
      - name: 检查前端依赖更新
        working-directory: frontend
        run: |
          npm outdated || true
          echo "## 前端依赖更新" >> $GITHUB_STEP_SUMMARY
          npm outdated --json > outdated.json || true
          cat outdated.json >> $GITHUB_STEP_SUMMARY
      
      - name: 检查安全漏洞
        run: |
          echo "## 安全漏洞检查" >> $GITHUB_STEP_SUMMARY
          cd backend && npm audit --json > audit-backend.json || true
          cd ../frontend && npm audit --json > audit-frontend.json || true
      
      - name: 创建 Issue（如果有重要更新）
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // 读取审计结果
            const backendAudit = JSON.parse(fs.readFileSync('backend/audit-backend.json', 'utf8'));
            const frontendAudit = JSON.parse(fs.readFileSync('frontend/audit-frontend.json', 'utf8'));
            
            const hasVulnerabilities = 
              (backendAudit.metadata?.vulnerabilities?.high > 0) ||
              (frontendAudit.metadata?.vulnerabilities?.high > 0);
            
            if (hasVulnerabilities) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ 发现高危安全漏洞',
                body: `检测到依赖包存在高危安全漏洞，请及时更新。\n\n查看详情：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['security', 'dependencies']
              });
            }
