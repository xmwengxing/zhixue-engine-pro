version: '3.8'

services:
  # ==========================================
  # PostgreSQL 数据库
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: training-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: training_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: training_platform
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - training-platform-network

  # ==========================================
  # Redis 缓存
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: training-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - training-platform-network

  # ==========================================
  # 后端 API 服务
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: training-platform-backend
    restart: unless-stopped
    environment:
      # 服务器配置
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost
      
      # 数据库配置
      DATABASE_URL: postgresql://training_user:password123@postgres:5432/training_platform?schema=public
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_DEFAULT_TTL: 3600
      
      # JWT 配置（生产环境请使用强密钥）
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-min-32-chars}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production-min-32-chars}
      JWT_REFRESH_EXPIRES_IN: 30d
      
      # AI 服务配置
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      
      # 日志配置
      LOG_LEVEL: info
      
      # 安全配置
      BCRYPT_ROUNDS: 10
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-in-production}
      
      # 其他配置
      APP_BASE_URL: http://localhost:3000
      FRONTEND_URL: http://localhost
    ports:
      - "3000:3000"
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - training-platform-network

  # ==========================================
  # 前端应用
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000/api}
    container_name: training-platform-frontend
    restart: unless-stopped
    # 不暴露端口：生产入口是 nginx（反代 frontend_app 内部端口）
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - training-platform-network

  # ==========================================
  # Nginx 反向代理（可选，用于统一入口）
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: training-platform-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - training-platform-network
    profiles:
      - with-nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local

networks:
  training-platform-network:
    driver: bridge
